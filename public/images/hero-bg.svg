<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="50%" stop-color="#0b1d35"/>
      <stop offset="100%" stop-color="#122240"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="30%" r="50%" fx="50%" fy="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c8a45a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c8a45a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1100" cy="300" rx="500" ry="450" fill="url(#glow)"/>
  <!-- Havlu yığını illüstrasyonu -->
  <g transform="translate(850, 160)" opacity="0.18">
    <!-- Alt havlu -->
    <rect x="0" y="280" width="500" height="80" rx="12" fill="#c8a45a"/>
    <!-- Orta havlu -->
    <rect x="20" y="200" width="460" height="85" rx="11" fill="#d9bc7a"/>
    <!-- Üst havlu 1 -->
    <rect x="40" y="125" width="420" height="80" rx="10" fill="#c8a45a"/>
    <!-- Üst havlu 2 -->
    <rect x="60" y="55" width="380" height="75" rx="9" fill="#b89040"/>
    <!-- Çizgi detayları -->
    <line x1="0" y1="308" x2="500" y2="308" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <line x1="20" y1="228" x2="480" y2="228" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <line x1="40" y1="153" x2="460" y2="153" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <line x1="60" y1="83" x2="440" y2="83" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(200,164,90,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1600" height="900" fill="url(#grid)"/>
</svg>
