<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a0a"/>
      <stop offset="100%" stop-color="#2a2a15"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- İplik masuraları / bobin yığınları -->
  <!-- Sol grup -->
  <g transform="translate(80, 100)">
    <ellipse cx="50" cy="30" rx="45" ry="20" fill="rgba(200,164,90,0.15)" stroke="rgba(200,164,90,0.35)" stroke-width="2"/>
    <rect x="5" y="30" width="90" height="200" fill="rgba(200,164,90,0.08)" stroke="rgba(200,164,90,0.25)" stroke-width="1.5"/>
    <ellipse cx="50" cy="230" rx="45" ry="20" fill="rgba(200,164,90,0.12)" stroke="rgba(200,164,90,0.3)" stroke-width="2"/>
    <!-- İplik çizgileri -->
    <line x1="20" y1="30" x2="20" y2="230" stroke="rgba(200,164,90,0.2)" stroke-width="1"/>
    <line x1="50" y1="30" x2="50" y2="230" stroke="rgba(200,164,90,0.25)" stroke-width="1.5"/>
    <line x1="80" y1="30" x2="80" y2="230" stroke="rgba(200,164,90,0.2)" stroke-width="1"/>
    <text x="50" y="265" font-family="system-ui,sans-serif" font-size="9" fill="rgba(200,164,90,0.4)" text-anchor="middle" letter-spacing="2">PAMUK</text>
  </g>

  <!-- Orta grup -->
  <g transform="translate(280, 80)">
    <ellipse cx="60" cy="35" rx="55" ry="22" fill="rgba(220,200,140,0.12)" stroke="rgba(220,200,140,0.3)" stroke-width="2"/>
    <rect x="5" y="35" width="110" height="240" fill="rgba(220,200,140,0.06)" stroke="rgba(220,200,140,0.2)" stroke-width="1.5"/>
    <ellipse cx="60" cy="275" rx="55" ry="22" fill="rgba(220,200,140,0.1)" stroke="rgba(220,200,140,0.25)" stroke-width="2"/>
    <line x1="25" y1="35" x2="25" y2="275" stroke="rgba(220,200,140,0.18)" stroke-width="1"/>
    <line x1="60" y1="35" x2="60" y2="275" stroke="rgba(220,200,140,0.22)" stroke-width="1.5"/>
    <line x1="95" y1="35" x2="95" y2="275" stroke="rgba(220,200,140,0.18)" stroke-width="1"/>
    <text x="60" y="310" font-family="system-ui,sans-serif" font-size="9" fill="rgba(220,200,140,0.35)" text-anchor="middle" letter-spacing="2">İPLİK</text>
  </g>

  <!-- Sağ grup -->
  <g transform="translate(520, 110)">
    <ellipse cx="50" cy="28" rx="45" ry="18" fill="rgba(180,140,80,0.12)" stroke="rgba(180,140,80,0.3)" stroke-width="2"/>
    <rect x="5" y="28" width="90" height="210" fill="rgba(180,140,80,0.07)" stroke="rgba(180,140,80,0.2)" stroke-width="1.5"/>
    <ellipse cx="50" cy="238" rx="45" ry="18" fill="rgba(180,140,80,0.1)" stroke="rgba(180,140,80,0.25)" stroke-width="2"/>
    <line x1="20" y1="28" x2="20" y2="238" stroke="rgba(180,140,80,0.18)" stroke-width="1"/>
    <line x1="50" y1="28" x2="50" y2="238" stroke="rgba(180,140,80,0.22)" stroke-width="1.5"/>
    <line x1="80" y1="28" x2="80" y2="238" stroke="rgba(180,140,80,0.18)" stroke-width="1"/>
    <text x="50" y="270" font-family="system-ui,sans-serif" font-size="9" fill="rgba(180,140,80,0.35)" text-anchor="middle" letter-spacing="2">DOKUMA</text>
  </g>

  <!-- Ekstra bobin -->
  <g transform="translate(700, 150)">
    <ellipse cx="45" cy="25" rx="40" ry="16" fill="rgba(200,164,90,0.1)" stroke="rgba(200,164,90,0.28)" stroke-width="2"/>
    <rect x="5" y="25" width="80" height="180" fill="rgba(200,164,90,0.06)" stroke="rgba(200,164,90,0.18)" stroke-width="1.5"/>
    <ellipse cx="45" cy="205" rx="40" ry="16" fill="rgba(200,164,90,0.08)" stroke="rgba(200,164,90,0.22)" stroke-width="2"/>
  </g>

  <!-- Zemin -->
  <rect x="0" y="480" width="900" height="120" fill="#0e0e06" opacity="0.7"/>
  <line x1="0" y1="480" x2="900" y2="480" stroke="rgba(200,164,90,0.1)" stroke-width="1"/>

  <!-- Etiket -->
  <text x="450" y="540" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="rgba(200,164,90,0.45)" text-anchor="middle" letter-spacing="4">PAMUK İPLİĞİ · DOKUMA ALTYAPISI</text>
</svg>
