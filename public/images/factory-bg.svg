<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1a28"/>
      <stop offset="100%" stop-color="#1a2d42"/>
    </linearGradient>
    <linearGradient id="machine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3d54"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Fabrika zemini -->
  <rect x="0" y="450" width="900" height="150" fill="#0a1520" opacity="0.6"/>

  <!-- Dokuma makinesi 1 -->
  <rect x="80" y="180" width="180" height="280" rx="4" fill="url(#machine)" stroke="rgba(200,164,90,0.2)" stroke-width="1"/>
  <rect x="95" y="195" width="150" height="80" rx="2" fill="rgba(200,164,90,0.08)" stroke="rgba(200,164,90,0.15)" stroke-width="1"/>
  <!-- İplik bobinleri -->
  <circle cx="120" cy="235" r="18" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="120" cy="235" r="8" fill="rgba(200,164,90,0.15)"/>
  <circle cx="165" cy="235" r="18" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="165" cy="235" r="8" fill="rgba(200,164,90,0.15)"/>
  <circle cx="210" cy="235" r="18" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="210" cy="235" r="8" fill="rgba(200,164,90,0.15)"/>
  <!-- İplik çizgileri -->
  <line x1="120" y1="253" x2="120" y2="460" stroke="rgba(200,164,90,0.15)" stroke-width="1.5"/>
  <line x1="165" y1="253" x2="165" y2="460" stroke="rgba(200,164,90,0.12)" stroke-width="1.5"/>
  <line x1="210" y1="253" x2="210" y2="460" stroke="rgba(200,164,90,0.15)" stroke-width="1.5"/>

  <!-- Dokuma makinesi 2 -->
  <rect x="310" y="160" width="200" height="300" rx="4" fill="url(#machine)" stroke="rgba(200,164,90,0.2)" stroke-width="1"/>
  <rect x="325" y="175" width="170" height="90" rx="2" fill="rgba(200,164,90,0.08)" stroke="rgba(200,164,90,0.15)" stroke-width="1"/>
  <circle cx="360" cy="220" r="20" fill="none" stroke="rgba(200,164,90,0.35)" stroke-width="3"/>
  <circle cx="360" cy="220" r="9" fill="rgba(200,164,90,0.18)"/>
  <circle cx="410" cy="220" r="20" fill="none" stroke="rgba(200,164,90,0.35)" stroke-width="3"/>
  <circle cx="410" cy="220" r="9" fill="rgba(200,164,90,0.18)"/>
  <circle cx="460" cy="220" r="20" fill="none" stroke="rgba(200,164,90,0.35)" stroke-width="3"/>
  <circle cx="460" cy="220" r="9" fill="rgba(200,164,90,0.18)"/>
  <line x1="360" y1="240" x2="360" y2="460" stroke="rgba(200,164,90,0.18)" stroke-width="1.5"/>
  <line x1="410" y1="240" x2="410" y2="460" stroke="rgba(200,164,90,0.14)" stroke-width="1.5"/>
  <line x1="460" y1="240" x2="460" y2="460" stroke="rgba(200,164,90,0.18)" stroke-width="1.5"/>

  <!-- Dokuma makinesi 3 -->
  <rect x="570" y="190" width="180" height="270" rx="4" fill="url(#machine)" stroke="rgba(200,164,90,0.2)" stroke-width="1"/>
  <rect x="585" y="205" width="150" height="75" rx="2" fill="rgba(200,164,90,0.08)" stroke="rgba(200,164,90,0.15)" stroke-width="1"/>
  <circle cx="620" cy="243" r="17" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="620" cy="243" r="7" fill="rgba(200,164,90,0.15)"/>
  <circle cx="660" cy="243" r="17" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="660" cy="243" r="7" fill="rgba(200,164,90,0.15)"/>
  <circle cx="700" cy="243" r="17" fill="none" stroke="rgba(200,164,90,0.3)" stroke-width="3"/>
  <circle cx="700" cy="243" r="7" fill="rgba(200,164,90,0.15)"/>
  <line x1="620" y1="260" x2="620" y2="460" stroke="rgba(200,164,90,0.15)" stroke-width="1.5"/>
  <line x1="660" y1="260" x2="660" y2="460" stroke="rgba(200,164,90,0.12)" stroke-width="1.5"/>
  <line x1="700" y1="260" x2="700" y2="460" stroke="rgba(200,164,90,0.15)" stroke-width="1.5"/>

  <!-- Tavan kirişleri -->
  <rect x="0" y="120" width="900" height="20" fill="#0d1a28" opacity="0.8"/>
  <line x1="0" y1="140" x2="900" y2="140" stroke="rgba(200,164,90,0.1)" stroke-width="1"/>
  <line x1="150" y1="140" x2="150" y2="200" stroke="rgba(200,164,90,0.08)" stroke-width="2"/>
  <line x1="450" y1="140" x2="450" y2="180" stroke="rgba(200,164,90,0.08)" stroke-width="2"/>
  <line x1="750" y1="140" x2="750" y2="195" stroke="rgba(200,164,90,0.08)" stroke-width="2"/>

  <!-- Işık efekti -->
  <ellipse cx="450" cy="100" rx="300" ry="80" fill="rgba(200,164,90,0.03)"/>

  <!-- Etiket -->
  <text x="450" y="540" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="rgba(200,164,90,0.5)" text-anchor="middle" letter-spacing="4">DOKUMA FABRİKASI · DENİZLİ</text>
</svg>
