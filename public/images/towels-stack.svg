<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0ea"/>
      <stop offset="100%" stop-color="#ede8e0"/>
    </linearGradient>
    <linearGradient id="t1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f4ee"/>
      <stop offset="100%" stop-color="#ece6de"/>
    </linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f1822"/>
    </linearGradient>
    <linearGradient id="t4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a9bb0"/>
      <stop offset="100%" stop-color="#6a7a90"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Arka plan subtle pattern -->
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="rgba(180,164,140,0.15)"/>
  </pattern>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Havlu yığını — ortada büyük -->
  <!-- Havlu 1 (en alt, koyu lacivert) -->
  <rect x="240" y="390" width="420" height="65" rx="6" fill="url(#t3)"/>
  <rect x="240" y="390" width="420" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
  <line x1="240" y1="420" x2="660" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Havlu 2 (gri-mavi) -->
  <rect x="255" y="325" width="390" height="68" rx="6" fill="url(#t4)"/>
  <rect x="255" y="325" width="390" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
  <line x1="255" y1="357" x2="645" y2="357" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Havlu 3 (krem) -->
  <rect x="268" y="262" width="364" height="66" rx="6" fill="url(#t2)"/>
  <rect x="268" y="262" width="364" height="11" rx="6" fill="rgba(255,255,255,0.4)"/>
  <line x1="268" y1="294" x2="632" y2="294" stroke="rgba(180,160,130,0.3)" stroke-width="1"/>
  <!-- Doku çizgileri -->
  <line x1="280" y1="270" x2="280" y2="322" stroke="rgba(180,160,130,0.12)" stroke-width="1"/>
  <line x1="380" y1="270" x2="380" y2="322" stroke="rgba(180,160,130,0.12)" stroke-width="1"/>
  <line x1="480" y1="270" x2="480" y2="322" stroke="rgba(180,160,130,0.12)" stroke-width="1"/>
  <line x1="580" y1="270" x2="580" y2="322" stroke="rgba(180,160,130,0.12)" stroke-width="1"/>

  <!-- Havlu 4 (beyaz) -->
  <rect x="280" y="200" width="340" height="65" rx="6" fill="url(#t1)"/>
  <rect x="280" y="200" width="340" height="10" rx="6" fill="rgba(255,255,255,0.8)"/>
  <line x1="280" y1="230" x2="620" y2="230" stroke="rgba(180,160,130,0.2)" stroke-width="1"/>
  <line x1="290" y1="208" x2="290" y2="258" stroke="rgba(180,160,130,0.08)" stroke-width="1"/>
  <line x1="380" y1="208" x2="380" y2="258" stroke="rgba(180,160,130,0.08)" stroke-width="1"/>
  <line x1="470" y1="208" x2="470" y2="258" stroke="rgba(180,160,130,0.08)" stroke-width="1"/>
  <line x1="560" y1="208" x2="560" y2="258" stroke="rgba(180,160,130,0.08)" stroke-width="1"/>

  <!-- Havlu 5 (en üst, lacivert) -->
  <rect x="295" y="142" width="310" height="61" rx="6" fill="url(#t3)"/>
  <rect x="295" y="142" width="310" height="10" rx="6" fill="rgba(255,255,255,0.1)"/>

  <!-- Gölge -->
  <ellipse cx="450" cy="468" rx="200" ry="18" fill="rgba(180,160,130,0.25)"/>

  <!-- Altın aksanlar -->
  <rect x="240" y="390" width="4" height="65" rx="2" fill="rgba(200,164,90,0.6)"/>
  <rect x="255" y="325" width="4" height="68" rx="2" fill="rgba(200,164,90,0.5)"/>
  <rect x="268" y="262" width="4" height="66" rx="2" fill="rgba(200,164,90,0.4)"/>
  <rect x="280" y="200" width="4" height="65" rx="2" fill="rgba(200,164,90,0.35)"/>
  <rect x="295" y="142" width="4" height="61" rx="2" fill="rgba(200,164,90,0.3)"/>

  <!-- Etiket -->
  <text x="450" y="520" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="rgba(100,80,60,0.5)" text-anchor="middle" letter-spacing="4">GÜRGENTEKSTİL · HAVLU KOLEKSİYONU</text>
</svg>
